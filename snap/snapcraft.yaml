name: rustdesk-snappy
base: core26
adopt-info: rustdesk
summary: Remote desktop software
description: |
  RustDesk is a remote desktop application. This development snap builds the
  Flutter Linux client from the official RustDesk repository.
grade: devel
confinement: devmode

layout:
  /usr/share/X11/XErrorDB:
    bind-file: $SNAP/gpu-2604/usr/share/X11/XErrorDB

platforms:
  amd64:
    build-on: [amd64]
    build-for: [amd64]

plugs:
  gpu-2604:
    interface: content
    target: $SNAP/gpu-2604
    default-provider: mesa-2604

parts:
  rustdesk:
    plugin: nil
    source: https://github.com/rustdesk/rustdesk.git
    source-type: git
    source-branch: master
    source-depth: 1
    source-submodules:
      - libs/hbb_common
    override-pull: |
      craftctl default
      version="$(python3 -c 'import re,sys; s=open(sys.argv[1]).read(); m=re.search(r"(?ms)^\[package\]\s*.*?^version\s*=\s*\"([^\"]+)\"", s); print(m.group(1) if m else "")' "$SNAPCRAFT_PART_SRC/Cargo.toml")"
      if [ -z "$version" ]; then
        echo "Could not read the RustDesk version from Cargo.toml" >&2
        exit 1
      fi
      craftctl set version="$version"
    build-packages:
      - zip
      - g++
      - gcc
      - git
      - curl
      - wget
      - nasm
      - yasm
      - libgtk-3-dev
      - clang
      - libxcb-randr0-dev
      - libxdo-dev
      - libxfixes-dev
      - libxcb-shape0-dev
      - libxcb-xfixes0-dev
      - libasound2-dev
      - libpulse-dev
      - cmake
      - make
      - libclang-dev
      - ninja-build
      - libgstreamer1.0-dev
      - libgstreamer-plugins-base1.0-dev
      - build-essential
      - pkg-config
      - python3
      - python3-pip
      - ca-certificates
      - unzip
      - xz-utils
      - libayatana-appindicator3-dev
      - libva-dev
      - libdrm-dev
      - libwayland-dev
      - wayland-protocols
      - libxkbcommon-dev
      - libsystemd-dev
      - libunwind-dev
      - llvm-dev
      - autoconf
      - automake
      - libtool
      - libssl-dev
    stage-packages:
      - libgtk-3-0t64
      - libayatana-appindicator3-1
      - hicolor-icon-theme
      - libxdo3
      - libxfixes3
      - libxcb-randr0
      - libxcb-shape0
      - libxcb-xfixes0
      - libasound2t64
      - libpulse0
      - libgstreamer1.0-0
      - libgstreamer-plugins-base1.0-0
      - libdrm2
      - libwayland-client0
      - libxkbcommon0
      - libdbus-1-3
      - libsystemd0
      - libssl3t64
      - curl
    override-build: |
      set -eu
      cd "$SNAPCRAFT_PART_SRC"

      rust_version=1.75.0
      flutter_version=3.24.5
      bridge_flutter_version=3.22.3
      bridge_codegen_version=1.80.1
      cargo_expand_version=1.0.95
      cmake_version=4.3.0

      curl -fsSL "https://github.com/Kitware/CMake/releases/download/v${cmake_version}/cmake-${cmake_version}-linux-x86_64.tar.gz" \
        -o "$SNAPCRAFT_PART_BUILD/cmake.tar.gz"
      tar -xzf "$SNAPCRAFT_PART_BUILD/cmake.tar.gz" -C "$SNAPCRAFT_PART_BUILD"
      export PATH="$SNAPCRAFT_PART_BUILD/cmake-${cmake_version}-linux-x86_64/bin:$PATH"

      curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs \
        -o "$SNAPCRAFT_PART_BUILD/rustup-init.sh"
      sh "$SNAPCRAFT_PART_BUILD/rustup-init.sh" -y \
        --default-toolchain "$rust_version" --profile minimal
      . "$HOME/.cargo/env"
      rustup component add rustfmt --toolchain "$rust_version"

      cargo install cargo-expand --version "$cargo_expand_version" --locked
      cargo install flutter_rust_bridge_codegen \
        --version "$bridge_codegen_version" --features uuid --locked

      # The pinned rust-webm source uses fixed-width integers without including cstdint.
      export CXXFLAGS="${CXXFLAGS:+$CXXFLAGS }-include cstdint"

      curl -fsSL "https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_${bridge_flutter_version}-stable.tar.xz" \
        -o "$SNAPCRAFT_PART_BUILD/flutter-codegen.tar.xz"
      tar -xf "$SNAPCRAFT_PART_BUILD/flutter-codegen.tar.xz" \
        -C "$SNAPCRAFT_PART_BUILD"
      mv "$SNAPCRAFT_PART_BUILD/flutter" \
        "$SNAPCRAFT_PART_BUILD/flutter-${bridge_flutter_version}"
      git config --global --add safe.directory \
        "$SNAPCRAFT_PART_BUILD/flutter-${bridge_flutter_version}"

      cp flutter/pubspec.yaml "$SNAPCRAFT_PART_BUILD/pubspec.yaml"
      cp flutter/pubspec.lock "$SNAPCRAFT_PART_BUILD/pubspec.lock"
      export PATH="$SNAPCRAFT_PART_BUILD/flutter-${bridge_flutter_version}/bin:$PATH"
      sed -i -e 's/extended_text: 14.0.0/extended_text: 13.0.0/g' \
        flutter/pubspec.yaml
      (cd flutter && flutter pub get)
      "$HOME/.cargo/bin/flutter_rust_bridge_codegen" \
        --rust-input ./src/flutter_ffi.rs \
        --dart-output ./flutter/lib/generated_bridge.dart \
        --c-output ./flutter/macos/Runner/bridge_generated.h
      cp ./flutter/macos/Runner/bridge_generated.h \
        ./flutter/ios/Runner/bridge_generated.h
      cp "$SNAPCRAFT_PART_BUILD/pubspec.yaml" flutter/pubspec.yaml
      cp "$SNAPCRAFT_PART_BUILD/pubspec.lock" flutter/pubspec.lock

      curl -fsSL "https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_${flutter_version}-stable.tar.xz" \
        -o "$SNAPCRAFT_PART_BUILD/flutter.tar.xz"
      tar -xf "$SNAPCRAFT_PART_BUILD/flutter.tar.xz" -C "$SNAPCRAFT_PART_BUILD"
      git config --global --add safe.directory "$SNAPCRAFT_PART_BUILD/flutter"
      export PATH="$SNAPCRAFT_PART_BUILD/flutter/bin:$SNAPCRAFT_PART_BUILD/flutter-${bridge_flutter_version}/bin:$HOME/.cargo/bin:$PATH"
      # Use the Flutter 3.24-compatible dependency after bridge codegen.
      sed -i -e 's/extended_text: 13.0.0/extended_text: 14.0.0/' \
        flutter/pubspec.yaml
      (cd flutter && flutter pub get)
      flutter precache --linux

      export VCPKG_ROOT="$SNAPCRAFT_PART_BUILD/vcpkg"
      export VCPKG_FORCE_SYSTEM_BINARIES=1
      vcpkg_baseline="$(python3 -c 'import json; print(json.load(open("vcpkg.json"))["vcpkg-configuration"]["default-registry"]["baseline"])')"
      git clone https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT"
      git -C "$VCPKG_ROOT" checkout --detach "$vcpkg_baseline"
      "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics
      "$VCPKG_ROOT/vcpkg" install --x-install-root="$VCPKG_ROOT/installed"

      ./build.py --flutter --no-drm

      install -d "$SNAPCRAFT_PART_INSTALL/usr/share/rustdesk"
      cp -a flutter/build/linux/x64/release/bundle/. \
        "$SNAPCRAFT_PART_INSTALL/usr/share/rustdesk/"
      install -d "$SNAPCRAFT_PART_INSTALL/bin"
      cat > "$SNAPCRAFT_PART_INSTALL/bin/rustdesk" <<'EOF'
      #!/bin/sh
      export LD_LIBRARY_PATH="$SNAP/usr/lib/x86_64-linux-gnu/pulseaudio${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
      cd "$SNAP/usr/share/rustdesk"
      exec "$SNAP/usr/share/rustdesk/rustdesk" "$@"
      EOF
      chmod 0755 "$SNAPCRAFT_PART_INSTALL/bin/rustdesk"

      install -d "$SNAPCRAFT_PART_INSTALL/usr/share/applications"
      cat > "$SNAPCRAFT_PART_INSTALL/usr/share/applications/rustdesk.desktop" <<'EOF'
      [Desktop Entry]
      Name=RustDesk
      Comment=Remote desktop software
      Exec=rustdesk
      Icon=rustdesk
      Terminal=false
      Type=Application
      Categories=Network;RemoteAccess;
      StartupWMClass=rustdesk
      EOF
      install -d "$SNAPCRAFT_PART_INSTALL/usr/share/icons/hicolor/256x256/apps"
      install -m 0644 res/128x128@2x.png \
        "$SNAPCRAFT_PART_INSTALL/usr/share/icons/hicolor/256x256/apps/rustdesk.png"

  gpu-2604:
    after: [rustdesk]
    plugin: dump
    source: https://github.com/canonical/gpu-snap.git
    source-branch: main
    source-depth: 1
    override-prime: |
      craftctl default
      "$CRAFT_PART_SRC/bin/gpu-2604-cleanup" mesa-2604
    prime:
      - bin/gpu-2604-wrapper

apps:
  rustdesk:
    command-chain:
      - bin/gpu-2604-wrapper
    command: bin/rustdesk
    desktop: usr/share/applications/rustdesk.desktop
    plugs:
      - desktop
      - gpu-2604
      - home
      - network
      - network-bind
      - audio-playback
      - audio-record
      - x11
      - wayland
      - hardware-observe
      - raw-input
      - uinput
